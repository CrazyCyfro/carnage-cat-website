<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Yan Wei — about, games, and contact.">
        <title>Yan Wei</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
        <link rel="manifest" href="site.webmanifest">
    </head>
    <body>
        <div class="wrap">
            <header class="site-header">
                <div class="header-intro">
                    <h1 class="name">Yan Wei</h1>
                    <p class="tagline">Singapore | GMT +8</p>
                </div>
                <ul class="header-socials" aria-label="Social profiles">
                    <li>
                        <a href="https://www.linkedin.com/in/yan-wei-sg/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                            <i class="fi-brands-linkedin-circle" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li>
                        <a href="https://discord.gg/CH3YXQcsUb" target="_blank" rel="noopener noreferrer" aria-label="Discord">
                            <i class="fi-brands-discord-circle" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li>
                        <a href="https://github.com/CrazyCyfro" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                            <i class="fi-brands-github" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li>
                        <a href="https://x.com/CrazyCyfro" target="_blank" rel="noopener noreferrer" aria-label="X">
                            <i class="fi-brands-twitter-alt-circle" aria-hidden="true"></i>
                        </a>
                    </li>
                </ul>
            </header>
            <main>
                <div class="tab-widget">
                    <input type="radio" name="page-tab" id="tab-about" class="tab-input" checked>
                    <input type="radio" name="page-tab" id="tab-games" class="tab-input">
                    <input type="radio" name="page-tab" id="tab-contact" class="tab-input">
                    <div class="tab-bar">
                        <label for="tab-about" class="tab-chip" id="label-about">About</label>
                        <label for="tab-games" class="tab-chip" id="label-games">Games</label>
                        <label for="tab-contact" class="tab-chip" id="label-contact">Contact</label>
                    </div>
                    <section id="panel-about" class="tab-panel" aria-labelledby="label-about">
                        <p>
                            I like playing and talking about games. Join my Discord server to get unprofessional opinions about your game!
                        </p>
                    </section>
                    <section id="panel-games" class="tab-panel" aria-labelledby="label-games">
                        <div class="game-feed">
                            <article class="game-post">
                                <h2 class="game-post-title">Minion Game</h2>
                                <div class="game-post-embed">
                                    <iframe height="167" src="https://itch.io/embed/2542820" width="552" title="Minion Game on itch.io">
                                        <a href="https://crazycyfro.itch.io/feb-2024">Game Demo - Feb 2024 by CrazyCyfro</a>
                                    </iframe>
                                </div>
                            </article>
                        </div>
                    </section>
                    <section id="panel-contact" class="tab-panel" aria-labelledby="label-contact">
                        <div class="form-embed">
                            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSd3uHs0F_OEMC1gnX628jQHVfSyYHf-CIKBCn1bnbwSNLjFvQ/viewform?embedded=true" width="640" height="691" title="Contact form">Loading…</iframe>
                        </div>
                    </section>
                </div>
            </main>
            <footer>
                <span class="meta">Last updated April 2026</span>
            </footer>
        </div>
    </body>
</html>
